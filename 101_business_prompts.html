<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>101 Business Prompts — WOWOS</title>
<style>
:root {
  --navy: #08090E;
  --navy2: #0F1118;
  --navy3: #161A26;
  --gold: #C9890B;
  --gold2: #E9A820;
  --sky: #0EA5E9;
  --sky2: #38BDF8;
  --green: #10B981;
  --coral: #E94560;
  --purple: #8B5CF6;
  --slate: #64748B;
  --surface: #12151F;
  --card: #181D2C;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #F1F0ED;
  --muted: #8A9BB0;
  --faint: #4A5568;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--navy);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }

/* HEADER */
.header {
  background: var(--navy2);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
.brand { display: flex; flex-direction: column; }
.brand-tag { font-size: 10px; font-weight: 600; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; }
.brand-title { font-size: 17px; font-weight: 600; color: var(--text); }
.header-right { display: flex; align-items: center; gap: 10px; }
.count-pill {
  background: var(--navy3); border: 1px solid var(--border2);
  border-radius: 20px; padding: 4px 14px;
  font-size: 12px; color: var(--muted);
}
.count-pill span { color: var(--gold); font-weight: 600; }

/* SEARCH + FILTER */
.controls {
  padding: 18px 24px;
  max-width: 1100px; margin: 0 auto;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.search-wrap { position: relative; flex: 1; min-width: 220px; }
.search-wrap input {
  width: 100%;
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 14px 10px 40px;
  font-size: 13px; color: var(--text); outline: none;
  transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--gold); }
.search-wrap input::placeholder { color: var(--faint); }
.search-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--faint); font-size: 15px; pointer-events: none;
}
.filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.fb {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; font-size: 12px; font-weight: 500;
  color: var(--muted); transition: all .15s; white-space: nowrap;
}
.fb:hover { border-color: var(--border2); color: var(--text); }
.fb.active { color: #fff; border-color: transparent; }

/* MAIN GRID */
.main { max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; }

/* AREA SECTION */
.area-section { margin-bottom: 36px; }
.area-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0 12px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.area-icon { font-size: 18px; }
.area-label { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
.area-count { font-size: 11px; color: var(--faint); margin-left: auto; }

/* PROMPT GRID */
.prompt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
}
.prompt-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px 12px;
  display: flex; flex-direction: column; gap: 7px;
  border-left: 3px solid transparent;
  transition: border-color .15s, transform .1s;
  cursor: default;
}
.prompt-card:hover { transform: translateY(-1px); }
.prompt-num {
  font-size: 10px; font-weight: 600; color: var(--faint);
  letter-spacing: .05em;
}
.prompt-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.35; }
.prompt-text {
  font-size: 12px; color: var(--muted); line-height: 1.55;
  background: rgba(0,0,0,0.2); border-radius: 7px;
  padding: 8px 10px; border: 1px solid var(--border);
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  word-break: break-word;
}
.prompt-text .bracket { color: var(--gold2); }
.copy-btn {
  align-self: flex-end;
  background: transparent; border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px;
  font-size: 11px; color: var(--muted);
  transition: all .12s;
}
.copy-btn:hover { border-color: var(--border2); color: var(--text); }
.copy-btn.copied { border-color: var(--green); color: var(--green); }

/* EMPTY STATE */
.empty { text-align: center; padding: 48px 24px; color: var(--faint); font-size: 14px; }

/* FOOTER */
.footer {
  text-align: center; padding: 24px;
  font-size: 11px; color: var(--faint); border-top: 1px solid var(--border);
}

/* NO SECTION FOUND */
.area-section.hidden { display: none; }

@media (max-width: 600px) {
  .controls { padding: 14px 16px; }
  .main { padding: 0 16px 60px; }
  .prompt-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-tag">WOWOS Fast Track</div>
    <div class="brand-title">101 Business Prompts</div>
  </div>
  <div class="header-right">
    <div class="count-pill">Showing <span id="visible-count">101</span> of 101</div>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <i class="ti ti-search search-icon" aria-hidden="true"></i>
    <input type="text" id="search" placeholder="Search prompts..." autocomplete="off">
  </div>
  <div class="filter-btns" id="filter-btns">
    <button class="fb active" data-filter="all" style="">All 101</button>
    <button class="fb" data-filter="marketing" style="--fc:#C9890B">📣 Marketing</button>
    <button class="fb" data-filter="sales" style="--fc:#10B981">📈 Sales</button>
    <button class="fb" data-filter="delivery" style="--fc:#0EA5E9">📦 Delivery</button>
    <button class="fb" data-filter="finance" style="--fc:#E94560">💰 Finance</button>
    <button class="fb" data-filter="people" style="--fc:#8B5CF6">👥 People</button>
    <button class="fb" data-filter="ai" style="--fc:#64748B">🤖 AI</button>
  </div>
</div>

<div class="main" id="main"></div>

<div class="footer">WOWOS Fast Track · 101 Business Prompts · wowos.in</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<script>
const AREAS = [
  {
    id:"marketing", icon:"📣", label:"Marketing", color:"#C9890B",

      {n:1, title:"ICP Profile Builder", text:"I run a [type of business] in [city] serving [client type]. Write a detailed Ideal Client Profile including: their job title, daily pain points, what they Google before buying, their biggest objection, and where they spend time online."},
      {n:2, title:"Competitor Positioning Gap", text:"My business is [describe business]. My top 3 competitors are [names]. Identify 3 positioning gaps where none of them are claiming authority — and write one headline I can own in each gap."},

      {n:4, title:"WhatsApp Broadcast Message", text:"Write a WhatsApp broadcast message for my [type of business] announcing [offer/event/news]. Audience: [describe them]. Tone: warm and direct, not corporate. Under 120 words. End with one clear action."},
      {n:5, title:"LinkedIn Post — Client Win", text:"Write a LinkedIn post about a recent client win: [describe the project and result]. Tell it as a story — problem, what we did, result. First line must stop the scroll. No hashtag spam. Professional but human."},
      {n:6, title:"Google My Business Description", text:"Write a 750-character Google Business Profile description for my [type of business] in [city]. Include what we do, who we serve, our key differentiator, and a soft call to action. No jargon."},
      {n:7, title:"Email Subject Line Generator", text:"Generate 10 email subject lines for a campaign about [topic/offer]. Audience: [describe]. Mix curiosity, urgency, and direct benefit approaches. No clickbait. Each under 50 characters."},
      {n:8, title:"Testimonial Request Message", text:"Write a 3-question WhatsApp message I can send to a past client to get a powerful testimonial. Questions should surface: their problem before us, what changed, and who they would recommend us to."},
      {n:9, title:"Content Calendar — 4 Weeks", text:"Create a 4-week content calendar for [platform: Instagram/LinkedIn/YouTube] for my [business type]. My ICP is [describe]. Include: post topic, format (reel/carousel/post), and hook line. One post per day."},
      {n:10, title:"Launch Announcement Copy", text:"Write a product/service launch announcement for [what you are launching]. Audience: [existing clients + warm leads]. Include: the problem it solves, what is new, price or offer, and a clear CTA. WhatsApp-ready."},
      {n:11, title:"Referral Program Message", text:"Write a message I can send to my top 10 clients asking for referrals. Business: [describe]. What I offer in return: [reward or recognition]. Tone: appreciative, not transactional. Under 80 words."},
      {n:12, title:"Pinterest Pin Description", text:"Write 5 Pinterest pin descriptions for [topic] targeting [your ICP]. Each should include searchable keywords, a benefit statement, and a call to visit [website/link]. Optimised for search, not just scroll."},
      {n:13, title:"YouTube Video Title + Description", text:"Write a YouTube title and description for a video about [topic]. Target audience: [describe]. Title: curiosity + benefit, under 60 characters. Description: 150 words, includes keywords, and ends with a CTA."},
      {n:14, title:"Case Study — One-Page", text:"Write a one-page case study for this client project: Client type: [describe]. Problem: [describe]. What we did: [describe]. Result: [specific numbers]. Format: headline, challenge, solution, outcome, quote placeholder."},
      {n:15, title:"Ad Copy — Meta Lead Generation", text:"Write a Meta ad for [offer] targeting [audience]. Stage: awareness/consideration/conversion [pick one]. Include: hook line, problem agitation, solution, and one CTA button text. Under 125 words primary text."},
      {n:16, title:"Brand Story — 3 Paragraphs", text:"Write my brand story in 3 short paragraphs. Business: [name and type]. Founded: [year and reason]. What we believe: [your core belief]. How we are different: [your USP]. Tone: founder-led, warm, credible."},
      {n:17, title:"Objection Handler — Marketing Version", text:"My prospects often say [top objection]. Write 3 short content pieces (one LinkedIn post, one Instagram caption, one WhatsApp message) that address this objection without sounding defensive. Turn the objection into proof."},

  },
  {

      {n:18, title:"Follow-Up Message — Day 1", text:"Write a WhatsApp follow-up message to send 24 hours after a client meeting about [your service/product]. Prospect: [describe]. Tone: warm, not pushy. Reference one specific thing from the meeting. Under 80 words."},
      {n:19, title:"Follow-Up Sequence — 7 Touches", text:"Write a 7-message WhatsApp follow-up sequence for a prospect who attended our demo but has not responded. Business: [describe]. Space messages over 21 days. Each message has a different angle: value, proof, urgency, story, question, resource, final offer."},

      {n:21, title:"Price Increase Announcement", text:"Write a message to existing clients announcing a [X]% price increase effective [date]. Reason: [genuine reason]. Tone: honest, appreciative, confident. Include an option to lock in current pricing before the deadline. Under 150 words."},
      {n:22, title:"Negotiation Floor Calculator Prompt", text:"My product/service costs me [cost] to deliver. My MRP is [price]. My target margin is [X]%. Generate: my target price, my Boundary 1 (first concession), and my floor price. Also suggest 2 value-add offers I can make instead of dropping price."},
      {n:23, title:"Lost Deal Debrief", text:"I lost a deal to [competitor/reason]. My offer was [describe]. Client chose [alternative] because [reason]. Write 3 specific changes I should make to my pitch, proposal, or follow-up process to win the next similar deal."},
      {n:24, title:"Cold Outreach — LinkedIn DM", text:"Write a cold LinkedIn DM to a [job title] at a [industry] company to introduce my [product/service]. No pitching in the first message. Lead with a relevant insight or observation. Under 60 words. End with a low-commitment question."},

      {n:26, title:"Dream 100 Outreach Sequence", text:"Write a 6-touch outreach sequence for my Dream 100 list (ideal clients I want to crack). Business: [describe]. Platform: [LinkedIn/email/WhatsApp]. Touches: research → connect → value share → soft ask → case study → meeting invite."},
      {n:27, title:"Re-engagement — Dormant Client", text:"Write a WhatsApp message to re-engage a client who bought from me [X months] ago and has gone quiet. Context: [what they bought, any reason they might be dormant]. Tone: genuine check-in. No hard sell. Under 60 words."},
      {n:28, title:"Objection Response — Price Too High", text:"A prospect said 'your price is too high.' My price is [price]. Competitor price is [price]. My key differentiators are [list]. Write a confident, respectful 3-sentence response that reframes value without discounting."},
      {n:29, title:"Objection Response — Let Me Think About It", text:"A prospect said 'let me think about it' at the end of our meeting. Write 3 different responses I could use — one that uncovers the real objection, one that adds urgency, and one that offers a low-risk next step."},

      {n:32, title:"Sales KPI Weekly Tracker Template", text:"Create a weekly sales KPI tracker template for a team of [X] salespeople. Include columns for: leads contacted, meetings held, proposals sent, follow-ups completed, deals closed, revenue generated, and one qualitative note. Format as a table."},
      {n:33, title:"Exhibition Booth Script", text:"Write a 60-second conversation starter script for my team to use at [exhibition/event name]. Business: [describe]. We want to capture contact details and book a follow-up meeting. Opening line, 2 qualifying questions, and a closing ask."},
      {n:34, title:"Warm Audience Reactivation Message", text:"Write a WhatsApp message to send to [X] past clients who have not bought in [X months]. Context: [what they previously bought]. Message should feel like a personal check-in, offer one piece of new value, and open the door without pressure."},

      {n:36, title:"Project Progress Update", text:"Write a WhatsApp progress update for a client at the [mid-point/milestone] of their [project type]. What is done: [describe]. What is next: [describe]. Timeline: [dates]. Tone: proactive and confident. Under 100 words. No jargon."},

      {n:38, title:"Project Completion Message", text:"Write a WhatsApp message marking the completion of a [project type] for [client type]. Celebrate the delivery, summarise the result in one line, and ask for: one photo/video testimonial and one referral. Warm, personal, brief."},

      {n:42, title:"Definition of Done — Per Role", text:"Write a clear Definition of Done for the [role, e.g. sales coordinator/project manager/delivery executive] in my [business type]. Include: minimum quality standard, what a completed task looks like, what proof is required, and who reviews it."},
      {n:43, title:"Vendor Brief", text:"Write a vendor brief for [type of vendor] for a project involving [description]. Include: scope of work, our quality standards, delivery timeline, payment terms, and the 3 non-negotiables we will not compromise on."},
      {n:44, title:"Process Flow Map Prompt", text:"I run a [business type]. Map the step-by-step flow for [key process, e.g. order to delivery / enquiry to project start]. Include every stage, who owns each step, where a decision point exists, and where the process most commonly gets stuck."},

    ]
  },
  {
    id:"people", icon:"👥", label:"People", color:"#8B5CF6",

      {n:68, title:"Job Description — Any Role", text:"Write a job description for a [role title] at a [type of business] in [city]. Include: role purpose (one sentence), 5 key responsibilities, 3 non-negotiable requirements, 2 nice-to-haves, and a culture statement. Tone: professional but human. No jargon."},

const AREA_COLORS = {
  marketing:"#C9890B", sales:"#10B981", delivery:"#0EA5E9",
  finance:"#E94560", people:"#8B5CF6", ai:"#64748B"
};
const FILTER_ACTIVE = {
  marketing:"background:#C9890B;color:#fff",
  sales:"background:#10B981;color:#fff",
  delivery:"background:#0EA5E9;color:#fff",
  finance:"background:#E94560;color:#fff",
  people:"background:#8B5CF6;color:#fff",
  ai:"background:#64748B;color:#fff",
  all:"background:#C9890B;color:#fff"
};

let currentFilter = "all";
let searchQuery = "";

function highlightBrackets(text) {
  return text.replace(/\[([^\]]+)\]/g, '<span class="bracket">[$1]</span>');
}

function renderAll() {
  const main = document.getElementById("main");
  let visibleCount = 0;
  let html = "";

  AREAS.forEach(area => {
    const areaColor = AREA_COLORS[area.id];
    if (currentFilter !== "all" && currentFilter !== area.id) return;

    const filtered = area.prompts.filter(p => {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q);
    });

    if (filtered.length === 0) return;
    visibleCount += filtered.length;

    html += `<div class="area-section">
      <div class="area-head">
        <span class="area-icon">${area.icon}</span>
        <span class="area-label" style="color:${areaColor}">${area.label}</span>
        <span style="font-size:12px;color:var(--faint);margin-left:4px">— ${area.desc}</span>
        <span class="area-count">${filtered.length} prompts</span>
      </div>
      <div class="prompt-grid">`;

    filtered.forEach(p => {
      html += `<div class="prompt-card" style="border-left-color:${areaColor}">
        <div class="prompt-num">#${p.n} · ${area.label.toUpperCase()}</div>
        <div class="prompt-title">${p.title}</div>
        <div class="prompt-text">${highlightBrackets(p.text)}</div>
        <button class="copy-btn" onclick="copyPrompt(this,'${p.n}')">Copy prompt</button>
      </div>`;
    });

    html += `</div></div>`;
  });

  if (html === "") {
    html = `<div class="empty">No prompts found for "<strong>${searchQuery}</strong>"</div>`;
  }

  main.innerHTML = html;
  document.getElementById("visible-count").textContent = visibleCount;
}

function copyPrompt(btn, num) {
  const card = btn.closest(".prompt-card");
  const textEl = card.querySelector(".prompt-text");
  const text = textEl.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "✓ Copied";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy prompt"; btn.classList.remove("copied"); }, 2000);
  }).catch(() => {
    btn.textContent = "Copy manually";
  });
}

// Filter buttons
document.getElementById("filter-btns").addEventListener("click", e => {
  const btn = e.target.closest(".fb");
  if (!btn) return;
  const f = btn.dataset.filter;
  currentFilter = f;
  document.querySelectorAll(".fb").forEach(b => {
    b.classList.remove("active");
    b.removeAttribute("style");
  });
  btn.classList.add("active");
  btn.style.cssText = FILTER_ACTIVE[f] || FILTER_ACTIVE.all;
  renderAll();
});

// Search
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value.trim();
  renderAll();
});

// Init active style
document.querySelector('.fb[data-filter="all"]').style.cssText = FILTER_ACTIVE.all;

renderAll();
</script>
